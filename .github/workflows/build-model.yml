name: build-campus-model

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/layout.csv'
      - 'scripts/build_layout.py'
      - 'index.html'
      - 'vendor/**'
      - '.github/workflows/build-model.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate layout model (cloud only)
        run: python scripts/build_layout.py

      - name: Commit generated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/
          if git diff --staged --quiet; then
            echo "模型无变化，跳过提交"
          else
            git commit -m "chore: 云端生成布局级白模 [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
